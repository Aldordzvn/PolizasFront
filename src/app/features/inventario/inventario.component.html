<header>
    <div class="links__container">
        <a routerLink="/dashboard">Inicio</a>
        <p>/</p>
        <a routerLink="/inventario" class="actual">Inventario</a>
    </div>

    <button routerLink="/inventario/nuevo">
        <i class="ti ti-plus"></i>
        Nuevo Articulo
    </button>
</header>


<main>
    <div class="table__container">
        <div class="table__header">
            <p class="txt title">Articulos</p>
            <p class="txt size"> ({{(inventarios$ | async)?.length ?? 0}}) </p>
        </div>
        <div class="table--wrapper">
            <table>
                <tr class="titles">
                    <th>SKU</th>
                    <th>Nombre</th>
                    <th>Cantidad</th>
                    <th></th>
                    <th></th>
                </tr>

                @for (inventario of (inventarios$ | async); track $index) {
                <tr>
                    <td> {{inventario.sku}} </td>
                    <td> {{inventario.nombre}} </td>
                    <td> {{inventario.cantidad}} </td>
                    <td>
                        <a [routerLink]="['/inventario', inventario.sku, 'editar']"><i class="ti ti-edit"></i></a>
                    </td>
                    <td>
                        <button (click)="abrirModalEliminar(inventario.sku)"><i class="ti ti-trash"></i></button>
                    </td>
                </tr>
                }
            </table>
        </div>
    </div>
</main>

<div class="modal" [class.active]="modalEstatus">
    <div class="modal__container">
        <p>¿Seguro que desea eliminar el registro?</p>
        <i class="ti ti-alert-octagon"></i>
        <div class="buttons__container">
            <button (click)="cerrarModalEliminar()" class="cancelar">Cancelar</button>
            <button class="eliminar" (click)="eliminarInventario()">Eliminar</button>
        </div>
    </div>
</div>
